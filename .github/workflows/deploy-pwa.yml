name: Build & Deploy Clean PWA

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Grant necessary permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Workbox and Build SW
        run: |
          npm init -y
          npm install workbox-build
          node build-sw.js

      - name: Fix Absolute Asset Paths
        run: |
          sed -i 's/href="\/assets\//href="assets\//g; s/src="\/assets\//src="assets\//g' *.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
