name: Build & Deploy Clean PWA

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies & Run SW Builder
        run: |
          npm init -y
          npm install workbox-build
          node build-sw.js

      - name: Fix Asset Paths
        run: |
          sed -i 's/href="\/assets\//href="assets\//g; s/src="\/assets\//src="assets\//g' *.html

      - name: Commit Cleaned HTML and SW Back to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html sw.js manifest.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-clean Mobirise footer, inject manifest & update sw.js [skip ci]"
          git push origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
