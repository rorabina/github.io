name: Inject PWA Tags into HTML

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

jobs:
  inject-pwa:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants permission to commit back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject PWA tags before closing head tag
        run: |
          PWA_TAGS='<link rel="manifest" href="/manifest.json">\n<script src="/sw-register.js"></script>'
          
          # Find all .html files and inject the tags if they aren't already present
          find . -maxdepth 2 -name "*.html" -exec bash -c '
            for file; do
              if ! grep -q "manifest.json" "$file"; then
                sed -i "s|</head>|  '"$PWA_TAGS"'\n</head>|i" "$file"
                echo "Injected PWA tags into $file"
              fi
            done
          ' bash {} +

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: inject PWA tags into HTML files" && git push)
