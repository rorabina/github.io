name: Inject PWA Tags and Auto-Update Cache List

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

jobs:
  inject-pwa:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject PWA tags into HTML files
        run: |
          PWA_TAGS='<link rel="manifest" href="/manifest.json">\n<script src="/sw-register.js"></script>'
          
          find . -maxdepth 2 -name "*.html" -exec bash -c '
            for file; do
              if ! grep -q "manifest.json" "$file"; then
                sed -i "s|</head>|  '"$PWA_TAGS"'\n</head>|i" "$file"
                echo "Injected PWA tags into $file"
              fi
            done
          ' bash {} +

      - name: Automatically update sw.js precache list
        run: |
          # Find all HTML, CSS, JS, Images, and Web Fonts across the site
          FILES_JSON=$(find . -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.jpg" -o -name "*.png" -o -name "*.svg" -o -name "*.woff2" \) -not -path '*/.*' | sed 's|^\.|""|' | jq -R . | jq -s .)
          
          # Inject the files directly into sw.js PRECACHE_ASSETS variable
          node -e '
            const fs = require("fs");
            const files = '"$FILES_JSON"';
            files.unshift("/", "/manifest.json");
            const uniqueFiles = [...new Set(files)];
            
            let swContent = fs.readFileSync("sw.js", "utf8");
            swContent = swContent.replace(
              /const PRECACHE_ASSETS = \[[\s\S]*?\];/,
              `const PRECACHE_ASSETS = ${JSON.stringify(uniqueFiles, null, 2)};`
            );
            fs.writeFileSync("sw.js", swContent);
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html sw.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: update HTML tags and full asset precache list" && git push)
