name: Inject PWA Cache & Assets

on:
  push:
    branches:
      - main

jobs:
  inject-pwa:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Dynamic Cache Name & Asset List
        run: |
          # 1. Replace CACHE_NAME with unique commit SHA
          sed -i "s/const CACHE_NAME = '[^']*';/const CACHE_NAME = 'ror-pwa-${{ github.sha }}';/g" sw.js

          # 2. Automatically generate array of HTML, CSS, JS, font, and asset files
          FILES=$(find . -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.json" -o -name "*.woff2" -o -name "*.svg" -o -name "*.png" -o -name "*.jpg" \) ! -path "./.git/*" ! -path "./.github/*" | sed 's|^\.|""|' | tr '\n' ',' | sed 's/,$//')

          # 3. Format as valid JS array
          FORMATTED_ASSETS=$(echo "$FILES" | sed 's/""\//"\//g')

          # 4. Inject asset array into sw.js
          sed -i "s|const PRECACHE_ASSETS = \[.*\];|const PRECACHE_ASSETS = [$FORMATTED_ASSETS];|g" sw.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update PWA cache name and asset precache list [skip ci]"
