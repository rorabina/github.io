name: Generate Capgo OTA Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'sw.js'
      - 'build-sw.js'
      - 'manifest.json'
      - 'update-manifest.json'
      - 'releases/**'
      - '**.md'

jobs:
  create-ota-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Capgo App Ready Script into index.html
        run: |
          # Inject the CapacitorUpdater notify snippet right before </body> tag in index.html
          sed -i '/<\/body>/i <script type="module">import { CapacitorUpdater } from "https://cdn.jsdelivr.net/npm/@capgo/capacitor-updater@6/dist/plugin.js"; window.addEventListener("load", () => { CapacitorUpdater.notifyAppReady(); });</script>' index.html

      - name: Zip Web Bundle
        run: |
          mkdir -p releases
          # Only zip web files needed by Capacitor
          zip -r releases/www-latest.zip index.html *.html assets/ sw.js manifest.json -x "*.git*"

      - name: Update Manifest Version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "{\"version\": \"$VERSION\", \"url\": \"https://rorabina.github.io/releases/www-latest.zip\"}" > update-manifest.json

      - name: Commit and Push Manifest & Zip
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/www-latest.zip update-manifest.json
          git commit -m "Auto-generate OTA release $VERSION with Capgo script [skip ci]" || exit 0
          git push
