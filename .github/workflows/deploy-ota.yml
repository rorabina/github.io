name: Generate Capgo OTA Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'update-manifest.json'
      - 'releases/**'
      - 'sw.js'
      - '**.md'

jobs:
  create-ota-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Run Build Script
        run: |
          npm init -y
          npm install workbox-build
          node build-sw.js

      - name: Fix Absolute Paths for Native WebView & Inject Capgo
        run: |
          sed -i 's/href="\/assets\//href="assets\//g; s/src="\/assets\//src="assets\//g; s/href="\//href="/g; s/src="\//src="/g' *.html
          sed -i '/<\/body>/i <script type="module">import { CapacitorUpdater } from "https://cdn.jsdelivr.net/npm/@capgo/capacitor-updater@6/dist/plugin.js"; window.addEventListener("load", () => { CapacitorUpdater.notifyAppReady(); });</script>' index.html

      - name: Zip Web Bundle
        run: |
          mkdir -p releases
          zip -r releases/www-latest.zip index.html *.html assets sw.js sw-register.js manifest.json -x "*.git*"

      - name: Update Manifest Version
        run: |
          VERSION="2.0.${{ github.run_number }}"
          echo "{\"version\": \"$VERSION\", \"url\": \"https://rorabina.github.io/releases/www-latest.zip\"}" > update-manifest.json

      - name: Commit and Push Release Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/www-latest.zip update-manifest.json sw.js *.html
          git stash
          git pull --rebase origin main
          git stash pop || true
          git commit -m "Auto-build SW, inject manifest & release OTA $VERSION [skip ci]" || exit 0
          git push
