name: Generate Capgo OTA Release & Clean Site

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'update-manifest.json'
      - 'releases/**'
      - '**.md'

jobs:
  build-clean-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch Latest Remote Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main

      - name: Run Build Script (Clean HTML & Generate SW)
        run: |
          npm init -y
          npm install workbox-build
          node build-sw.js

      - name: Fix Absolute Paths & Inject Capgo Script
        run: |
          # Convert absolute asset paths to relative paths for Capacitor native builds
          sed -i 's/href="\/assets\//href="assets\//g; s/src="\/assets\//src="assets\//g; s/href="\//href="/g; s/src="\//src="/g' *.html

          # Inject Capgo updater script before </body> tag in index.html if missing
          if ! grep -q 'CapacitorUpdater' index.html; then
            sed -i '/<\/body>/i <script type="module">import { CapacitorUpdater } from "https://cdn.jsdelivr.net/npm/@capgo/capacitor-updater@6/dist/plugin.js"; window.addEventListener("load", () => { CapacitorUpdater.notifyAppReady(); });</script>' index.html
          fi

      - name: Zip Web Bundle for Capgo OTA
        run: |
          mkdir -p releases
          zip -r releases/www-latest.zip index.html *.html assets sw.js sw-register.js manifest.json -x "*.git*"

      - name: Update Manifest Version
        run: |
          VERSION="2.0.${{ github.run_number }}"
          echo "{\"version\": \"$VERSION\", \"url\": \"https://raw.githubusercontent.com/rorabina/rorabina.github.io/main/releases/www-latest.zip\"}" > update-manifest.json

      - name: Commit and Push Cleaned Files Back to Main
        run: |
          git add *.html sw.js releases/www-latest.zip update-manifest.json
          git commit -m "Auto-clean Mobirise links, inject PWA manifest & update OTA $VERSION [skip ci]" || exit 0
          git push origin main
