name: Generate Capgo OTA Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'update-manifest.json'
      - 'releases/**'
      - 'sw.js'
      - '**.md'

jobs:
  create-ota-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Absolute Paths & Inject Capgo Script
        run: |
          # Recursively strip leading slashes from href and src attributes in all HTML files
          sed -i 's/href="\/assets\//href="assets\//g; s/src="\/assets\//src="assets\//g; s/href="\//href="/g; s/src="\//src="/g' *.html

          # Inject the CapacitorUpdater notify snippet right before </body> tag in index.html
          sed -i '/<\/body>/i <script type="module">import { CapacitorUpdater } from "https://cdn.jsdelivr.net/npm/@capgo/capacitor-updater@6/dist/plugin.js"; window.addEventListener("load", () => { CapacitorUpdater.notifyAppReady(); });</script>' index.html

      - name: Zip Web Bundle
        run: |
          mkdir -p releases
          # Removing trailing slash from assets ensures recursive inclusion of all CSS/JS subfolders
          zip -r releases/www-latest.zip index.html *.html assets sw.js sw-register.js manifest.json -x "*.git*"

      - name: Update Manifest Version
        run: |
          VERSION="2.0.${{ github.run_number }}"
          echo "{\"version\": \"$VERSION\", \"url\": \"https://rorabina.github.io/releases/www-latest.zip\"}" > update-manifest.json

      - name: Commit and Push Manifest & Zip
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/www-latest.zip update-manifest.json
          git commit -m "Auto-fix absolute paths & generate OTA release $VERSION [skip ci]" || exit 0
          git push
