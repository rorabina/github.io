name: Auto Update Service Worker Precache & Inject Manifest

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - 'sw.js'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/setup-node@v4

      - name: Inject Manifest and SW Register Tags into HTML
        run: |
          for file in *.html; do
            if ! grep -q 'rel="manifest"' "$file"; then
              sed -i 's|</head>|  <link rel="manifest" href="/manifest.json">\n  <script src="/sw-register.js" defer></script>\n</head>|i' "$file"
              echo "Injected manifest into $file"
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Service Worker generator script
        run: node build-sw.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --staged --quiet || (git commit -m "Auto-inject PWA manifest & update sw.js precache list [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
