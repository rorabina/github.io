name: Auto Update Service Worker Precache

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - 'sw.js'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/checkout@v4
        with:
          node-version: '18'

      - name: Run Service Worker generator script
        run: node build-sw.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sw.js
          git diff --staged --quiet || (git commit -m "Auto-update sw.js precache list [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
