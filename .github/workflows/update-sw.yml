name: Auto Update Service Worker Precache & Inject Manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject Manifest and SW Register Tags into HTML
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            function getHtmlFiles(dir) {
              let results = [];
              const list = fs.readdirSync(dir);
              list.forEach(file => {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat && stat.isDirectory()) {
                  if (!file.startsWith(".") && file !== "node_modules") {
                    results = results.concat(getHtmlFiles(filePath));
                  }
                } else if (file.endsWith(".html")) {
                  results.push(filePath);
                }
              });
              return results;
            }
            const files = getHtmlFiles(".");
            files.forEach(file => {
              let content = fs.readFileSync(file, "utf8");
              let updated = false;
              if (!content.includes("/manifest.json")) {
                content = content.replace(/<\/head\s*>/i, "\n  <link rel=\"manifest\" href=\"/manifest.json\">\n</head>");
                updated = true;
              }
              if (!content.includes("/sw-register.js")) {
                content = content.replace(/<\/head\s*>/i, "\n  <script src=\"/sw-register.js\" defer></script>\n</head>");
                updated = true;
              }
              if (updated) {
                fs.writeFileSync(file, content, "utf8");
                console.log("Injected missing PWA tags into " + file);
              }
            });
          '

      - name: Run Service Worker generator script
        run: node build-sw.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-inject PWA manifest & update sw.js precache list [skip ci]" && git push origin main)
