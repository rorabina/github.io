name: Auto Update Service Worker Precache & Inject Manifest

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - 'sw.js'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Inject Manifest and SW Register Tags into HTML
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".").filter(f => f.endsWith(".html"));
            files.forEach(file => {
              let content = fs.readFileSync(file, "utf8");
              if (!content.includes("rel=\"manifest\"")) {
                const tags = "\n  <link rel=\"manifest\" href=\"/manifest.json\">\n  <script src=\"/sw-register.js\" defer></script>\n";
                content = content.replace(/<\/head>/i, tags + "</head>");
                fs.writeFileSync(file, content, "utf8");
                console.log("Injected PWA tags into " + file);
              }
            });
          '

      - name: Run Service Worker generator script
        run: node build-sw.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --staged --quiet || (git commit -m "Auto-inject PWA manifest & update sw.js precache list [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
