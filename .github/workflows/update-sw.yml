name: Auto Update Service Worker Precache & Inject Manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject Manifest, SW Register Tags, and Clean Mobirise Branding
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            function getHtmlFiles(dir) {
              let results = [];
              const list = fs.readdirSync(dir);
              list.forEach(file => {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat && stat.isDirectory()) {
                  if (!file.startsWith(".") && file !== "node_modules") {
                    results = results.concat(getHtmlFiles(filePath));
                  }
                } else if (file.endsWith(".html")) {
                  results.push(filePath);
                }
              });
              return results;
            }

            const files = getHtmlFiles(".");
            files.forEach(file => {
              let content = fs.readFileSync(file, "utf8");
              let updated = false;

              // 1. Inject PWA Manifest if missing
              if (!content.includes("/manifest.json")) {
                content = content.replace(/<\/head\s*>/i, "\n  <link rel=\"manifest\" href=\"/manifest.json\">\n</head>");
                updated = true;
              }

              // 2. Inject SW Register script if missing
              if (!content.includes("/sw-register.js")) {
                content = content.replace(/<\/head\s*>/i, "\n  <script src=\"/sw-register.js\" defer></script>\n</head>");
                updated = true;
              }

              // 3. Remove Mobirise branding & credits
              const cleanedContent = content
                .replace(/<section[^>]*class="[^"]*cid-mobirise-credit[^"]*"[^>]*>[\s\S]*?<\/section>/gi, "")
                .replace(/<section[^>]*>\s*<a[^>]*href="https?:\/\/(www\.)?mobirise\.(com|site|design)"[^>]*>[\s\S]*?<\/section>/gi, "")
                .replace(/<section[^>]*style="[^"]*visibility:\s*hidden[^"]*"[^>]*>[\s\S]*?<\/section>/gi, "")
                .replace(/<a[^>]*href="https?:\/\/(www\.)?mobirise\.(com|site|design)"[^>]*>[\s\S]*?<\/a>/gi, "");

              if (cleanedContent !== content) {
                content = cleanedContent;
                updated = true;
                console.log("Removed Mobirise credits from " + file);
              }

              if (updated) {
                fs.writeFileSync(file, content, "utf8");
                console.log("Updated HTML file: " + file);
              }
            });
          '

      - name: Run Service Worker generator script
        run: node build-sw.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-inject PWA manifest, clean Mobirise branding & update sw.js [skip ci]" && git push origin main)
