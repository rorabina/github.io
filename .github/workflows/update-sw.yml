name: Auto Update Service Worker Precache & Inject Manifest

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'sw.js'
      - 'build-sw.js'
      - 'manifest.json'
      - '**.md'

concurrency:
  group: sw-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-inject:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install workbox-build

      - name: Run Build Script
        run: node build-sw.js

      - name: Commit and Push Updated Service Worker
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-inject PWA manifest & update sw [skip ci]" && git push)
